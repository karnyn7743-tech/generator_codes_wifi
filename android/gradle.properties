# ============================================================
# === إعدادات Gradle العامة ===
# ============================================================

# ذاكرة JVM المخصصة لعملية Gradle
# KeyGen مشروع بسيط، لا يحتاج ذاكرة كثيرة مثل LanPhone
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ============================================================
# === إعدادات AndroidX و Jetifier ===
# ============================================================

# استخدام مكتبات AndroidX بدلاً من Support Library القديمة
android.useAndroidX=true

# تحويل المكتبات القديمة (Support) تلقائيًا إلى AndroidX
android.enableJetifier=true

# ============================================================
# === إعدادات الأداء والبناء ===
# ============================================================

# عدم إنشاء R class لكل مكتبة على حدة
android.nonTransitiveRClass=true

# تفعيل بناء Gradle المتوازي
org.gradle.parallel=true

# تفعيل التخزين المؤقت للبناء
org.gradle.caching=true

# تفعيل Gradle Daemon
org.gradle.daemon=true

# ============================================================
# === إعدادات Kotlin ===
# ============================================================

# زيادة ذاكرة Kotlin compiler
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512M

# ============================================================
# === إعدادات Flutter (مهمة) ===
# ============================================================

# الحد الأدنى لإصدار Android (23 = Android 6.0)
flutter.minSdkVersion=23

# الإصدار المستهدف (34 = Android 14)
flutter.targetSdkVersion=34

# الإصدار المستخدم للبناء (34 = Android 14)
flutter.compileSdkVersion=34
