name: Build LanPhone_KeyGen APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build KeyGen APK
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # 1) استنساخ الكود
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v5

      # ============================================
      # 2) تثبيت Java 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # ============================================
      # 3) تثبيت Flutter
      # ============================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      # ============================================
      # 4) التحقق من Flutter
      # ============================================
      - name: Verify Flutter
        run: flutter doctor -v

      # ============================================
      # 5) حذف pubspec.lock (لضمان تحديث التبعيات)
      # ============================================
      - name: Remove lock file
        run: rm -f pubspec.lock

      # ============================================
      # 6) تنظيف المشروع
      # ============================================
      - name: Clean project
        run: flutter clean

      # ============================================
      # 7) تنزيل الحزم
      # ============================================
      - name: Get dependencies
        run: flutter pub get

      # ============================================
      # 8) تحليل الكود (تحذيري فقط)
      # ============================================
      - name: Analyze code
        run: flutter analyze || true

      # ============================================
      # 9) بناء APK
      # ============================================
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64

      # ============================================
      # 10) عرض معلومات APK
      # ============================================
      - name: Show APK info
        if: always()
        run: |
          echo "═══════════════════════════════════════"
          echo "📦 APK Info"
          echo "═══════════════════════════════════════"
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || echo "لا يوجد APK"

      # ============================================
      # 11) رفع APK
      # ============================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lanphone-keygen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
